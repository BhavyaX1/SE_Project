<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Schedule | CampusHub</title>
<link href="style.css?v=3" rel="stylesheet"/>
<script src="theme.js?v=5"></script></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<header class="topbar">
<div class="page-name">Schedule</div>
<div class="user">
<span></span>
<div class="avatar"></div>
</div>
</header>
<div class="content">
<div class="page-heading">
<div>
<h1>Schedule</h1>
<div class="subtitle">Your weekly timetable from your saved classes.</div>
</div>
<div class="toolbar"><a class="btn primary" href="settings.html#schedule-section">Edit schedule</a></div>
</div>
<div class="stats">
<div class="stat">
<div class="stat-value" data-stat="classes">0</div>
<div class="stat-label">Classes this week</div>
</div>
<div class="stat">
<div class="stat-value" data-stat="hours">0 hrs</div>
<div class="stat-label">Scheduled learning</div>
</div>


</div>
<div class="grid">
<section class="panel">
<div class="panel-head"><h2 data-today-title="">Today</h2><span class="badge blue">Today</span></div>
<div data-render="today" data-variant="full"></div>
</section>

</div>
<div class="panel" style="margin-top:18px">
<div class="panel-head"><h2>Weekly overview</h2><span class="muted">Monday – Friday</span></div>
<div class="table-wrap" data-render="week"></div>
</div>
</div>
</main>
</div>
<script defer="" src="sidebar.js?v=3"></script><script defer="" src="avatar.js?v=3"></script><script defer="" src="api.js?v=5"></script>
<script defer="" src="app.js?v=3"></script>
</body>
</html>
