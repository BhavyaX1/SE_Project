<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Attendance | CampusHub</title>
    <link href="style.css" rel="stylesheet">
    <link href="attendance.css" rel="stylesheet">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">CampusHub</div>
        <nav class="nav"><a class="" href="index.html">Dashboard</a><a class="" href="courses.html">Courses</a><a class="" href="schedule.html">Schedule</a><a class="active" href="attendance.html">Attendance</a><a class="" href="grades.html">Grades</a><a class="" href="assignments.html">Assignments</a><a class="" href="messages.html">Messages</a><a class="" href="settings.html">Settings</a></nav>

          <div class="user">

          <div class="grid grid-3" id="att-list"></div>
        </div>
      </main>
    </div>
    <script defer src="api.js"></script>
