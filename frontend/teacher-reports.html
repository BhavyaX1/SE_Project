<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Reports | CampusHub</title>
<link href="style.css?v=3" rel="stylesheet"/>
<link href="attendance.css?v=3" rel="stylesheet"/>
<script src="theme.js?v=7"></script></head>
<body data-page="reports">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<header class="topbar">
<div class="page-name">Reports</div>
<div class="user">
<span></span>
<div class="avatar"></div>
</div>
</header>
<div class="content">
<div class="page-heading">
<div>
<h1>Attendance Reports</h1>
<div class="subtitle">See every student's attendance per course and export it.</div>
</div>
<div class="toolbar"><button class="btn" id="csv" type="button">Export CSV</button></div>
</div>
<section class="panel">
<div class="inline" style="margin-bottom:16px">
<select aria-label="Course" id="course"></select>
<label style="margin:0">Minimum % <input id="thr" max="100" min="1" style="width:80px" type="number" value="75"/></label>
<label style="margin:0"><input id="lowOnly" style="width:auto" type="checkbox"/> Only students below minimum</label>
<input class="search" id="q" placeholder="Search student..." type="search"/>
</div>
<div class="counts" id="summary" style="margin-bottom:12px"></div>
<div class="table-wrap" id="report"></div>
</section>
</div>
</main>
</div>
<script defer="" src="sidebar.js?v=3"></script><script defer="" src="avatar.js?v=3"></script><script defer="" src="api.js?v=5"></script>
<script defer="" src="teacher.js?v=3"></script>
</body>
</html>
