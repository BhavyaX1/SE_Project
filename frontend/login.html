<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Log in | CampusHub</title>
    <link href="style.css" rel="stylesheet">
    <link href="attendance.css" rel="stylesheet">
  </head>
  <body>
    <div style="max-width:360px;margin:90px auto;padding:0 15px">
      <h1>CampusHub</h1>
      <div class="subtitle" style="margin-bottom:18px">Log in, or create a new account.</div>
      <div class="panel">
        <div class="field">
          <label>I am a</label>
          <div class="seg" id="roleSeg" style="display:flex">
            <button type="button" class="on" data-role="student" style="flex:1">Student</button>
            <button type="button" data-role="teacher" style="flex:1">Teacher</button>
          </div>
        </div>
        <div class="field"><label for="username">Username</label><input id="username" autocomplete="username"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
        <div class="field"><label for="name">Full name (only for a new account)</label><input id="name"></div>
        <div class="field" id="codeField" hidden><label for="code">Teacher signup code (only for a new teacher account)</label><input id="code" type="password"></div>
        <div class="form-error" id="message" role="alert"></div>
        <div class="toolbar">
          <button class="btn primary" id="loginBtn" type="button">Log in</button>
          <button class="btn" id="registerBtn" type="button">Create account</button>
        </div>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      var role = 'student';

      // Student / Teacher toggle
      document.querySelectorAll('#roleSeg button').forEach(function (b) {
        b.addEventListener('click', function () {
          role = b.getAttribute('data-role');
          document.querySelectorAll('#roleSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
          document.getElementById('codeField').hidden = role !== 'teacher';
          document.getElementById('message').textContent = '';
        });
      });

      async function submit(kind) {
        localStorage.removeItem('token');
        localStorage.removeItem('role');
        var body = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };
        if (kind === 'register') {
          body.name = document.getElementById('name').value.trim();
          body.role = role;
          body.teacher_code = document.getElementById('code').value;
        }

        var res = await apiJson('POST', kind === 'register' ? '/register/' : '/login/', body);
        if (!res.ok) {
          document.getElementById('message').textContent = errorText(res.data);
          return;
        }
        if (kind === 'login' && res.data.role !== role) {       // wrong tab selected
          document.getElementById('message').textContent =
            'This is a ' + res.data.role + ' account. Choose "' + (res.data.role === 'teacher' ? 'Teacher' : 'Student') + '" above.';
          return;
        }
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('role', res.data.role);
        localStorage.setItem('name', res.data.name || '');
        window.location.href = res.data.role === 'teacher' ? 'teacher.html' : 'index.html';
      }

      document.getElementById('loginBtn').addEventListener('click', function () { submit('login'); });
      document.getElementById('registerBtn').addEventListener('click', function () { submit('register'); });
      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submit('login');
      });
    </script>
  </body>
</html>
