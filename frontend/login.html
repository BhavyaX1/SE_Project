
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Register | CampusHub</title>

    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="attendance.css?v=6">

    <script src="theme.js?v=6"></script>

    <style>
        .login-container {
            max-width: 440px;
            margin: 55px auto;
            padding: 0 16px;
        }

        .login-container h1 {
            margin-bottom: 8px;
        }

        .login-panel {
            padding: 25px;
        }

        .login-theme {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .login-theme select {
            width: 145px;
        }

        .login-tabs,
        .login-role {
            display: flex;
            gap: 6px;
            padding: 5px;
            border-radius: 10px;
            background: var(--page, #f1f5f9);
            margin-bottom: 20px;
        }

        .login-tabs button,
        .login-role button {
            flex: 1;
            padding: 11px 10px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text, #1e293b);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .login-tabs button.active,
        .login-role button.active {
            background: var(--white, #ffffff);
            color: var(--text, #1e293b);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
        }

        .login-tabs button:hover,
        .login-role button:hover {
            opacity: 0.85;
        }

        .login-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-form .field {
            margin-bottom: 17px;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
        }

        .login-submit {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            cursor: pointer;
        }

        .login-message {
            min-height: 22px;
            margin-top: 12px;
            font-size: 13px;
            color: #dc4545;
        }

        .login-help {
            font-size: 12px;
            color: var(--muted, #64748b);
            line-height: 1.6;
            margin-top: 7px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted, #64748b);
        }

        [hidden] {
            display: none !important;
        }

        /* Dark mode for the login controls */
        html[data-theme="dark"] .login-tabs,
        html[data-theme="dark"] .login-role {
            background: #111827;
        }

        html[data-theme="dark"] .login-tabs button.active,
        html[data-theme="dark"] .login-role button.active {
            background: #374151;
            color: #f9fafb;
        }

        html[data-theme="dark"] .login-tabs button,
        html[data-theme="dark"] .login-role button {
            color: #f9fafb;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 25px auto;
            }

            .login-panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>CampusHub</h1>
        <p class="subtitle">
            College Management System
        </p>

        <section class="panel login-panel">

            <!-- LOGIN PAGE APPEARANCE -->
            <div class="login-theme">

                <label for="theme-select">
                    Appearance
                </label>

                <select id="theme-select">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">System Default</option>
                </select>

            </div>

            <!-- LOGIN / REGISTER TABS -->
            <div class="login-tabs" role="group" aria-label="Login or register">

                <button
                    type="button"
                    id="loginTab"
                    class="active"
                    aria-pressed="true">
                    Login
                </button>

                <button
                    type="button"
                    id="registerTab"
                    aria-pressed="false">
                    Register
                </button>

            </div>

            <!-- ACCOUNT ROLE -->
            <label class="login-label">
                Account Type
            </label>

            <div class="login-role" role="group" aria-label="Account type">

                <button
                    type="button"
                    id="studentBtn"
                    class="active"
                    aria-pressed="true">
                    Student
                </button>

                <button
                    type="button"
                    id="teacherBtn"
                    aria-pressed="false">
                    Teacher
                </button>

            </div>

            <!-- LOGIN / REGISTRATION FORM -->
            <form id="accountForm">

                <!-- FULL NAME: REGISTRATION ONLY -->
                <div class="field" id="nameField" hidden>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        placeholder="Enter your full name">

                </div>

                <!-- USERNAME -->
                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required>

                </div>

                <!-- PASSWORD -->
                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>

                </div>

                <!-- TEACHER SIGNUP CODE -->
                <div class="field" id="codeField" hidden>

                    <label for="code">
                        Teacher Signup Code
                    </label>

                    <input
                        type="password"
                        id="code"
                        name="code"
                        autocomplete="off"
                        placeholder="Enter teacher registration code">

                    <p class="login-help">
                        A teacher signup code is required only
                        when creating a new teacher account.
                        Existing teachers can log in normally.
                    </p>

                </div>

                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    class="btn primary login-submit"
                    id="submitBtn">
                    Login as Student
                </button>

                <!-- ERROR MESSAGE -->
                <div
                    class="login-message"
                    id="message"
                    role="status"
                    aria-live="polite">
                </div>

            </form>

            <p class="login-footer" id="footerText">
                Don't have an account? Select Register above.
            </p>

        </section>

    </main>

    <script src="api.js?v=6"></script>

    <script>
        (function () {
            "use strict";

            const $ = (selector) =>
                document.querySelector(selector);

            let mode = "login";
            let role = "student";
            let busy = false;

            // =====================================
            // UPDATE LOGIN / REGISTER INTERFACE
            // =====================================

            function updateInterface() {

                const isRegister = mode === "register";
                const isTeacher = role === "teacher";

                // Show full name only when registering
                $("#nameField").hidden = !isRegister;

                // Show teacher code only for
                // teacher registration
                $("#codeField").hidden =
                    !(isRegister && isTeacher);

                // Update form requirements
                $("#name").required = isRegister;
                $("#code").required =
                    isRegister && isTeacher;

                // Update password autocomplete
                $("#password").autocomplete =
                    isRegister
                        ? "new-password"
                        : "current-password";

                // Highlight Login/Register tab
                $("#loginTab").classList.toggle(
                    "active", !isRegister
                );

                $("#registerTab").classList.toggle(
                    "active", isRegister
                );

                $("#loginTab").setAttribute(
                    "aria-pressed",
                    String(!isRegister)
                );

                $("#registerTab").setAttribute(
                    "aria-pressed",
                    String(isRegister)
                );

                // Highlight Student/Teacher button
                $("#studentBtn").classList.toggle(
                    "active", !isTeacher
                );

                $("#teacherBtn").classList.toggle(
                    "active", isTeacher
                );

                $("#studentBtn").setAttribute(
                    "aria-pressed",
                    String(!isTeacher)
                );

                $("#teacherBtn").setAttribute(
                    "aria-pressed",
                    String(isTeacher)
                );

                // Update submit button
                const action = isRegister
                    ? "Register"
                    : "Login";

                const accountType = isTeacher
                    ? "Teacher"
                    : "Student";

                $("#submitBtn").textContent =
                    action + " as " + accountType;

                $("#footerText").textContent =
                    isRegister
                        ? "Already have an account? Select Login above."
                        : "Don't have an account? Select Register above.";

                $("#message").textContent = "";
            }

            // =====================================
            // SWITCH LOGIN / REGISTER
            // =====================================

            $("#loginTab").addEventListener(
                "click", function () {
                    mode = "login";
                    updateInterface();
                }
            );

            $("#registerTab").addEventListener(
                "click", function () {
                    mode = "register";
                    updateInterface();
                }
            );

            // =====================================
            // SWITCH STUDENT / TEACHER
            // =====================================

            $("#studentBtn").addEventListener(
                "click", function () {
                    role = "student";
                    updateInterface();
                }
            );

            $("#teacherBtn").addEventListener(
                "click", function () {
                    role = "teacher";
                    updateInterface();
                }
            );

            // =====================================
            // SUBMIT FORM
            // =====================================

            $("#accountForm").addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    if (busy) return;

                    const username =
                        $("#username").value.trim();

                    const password =
                        $("#password").value;

                    const message = $("#message");

                    message.textContent = "";

                    if (!username || !password) {
                        message.textContent =
                            "Enter your username and password.";
                        return;
                    }

                    // Request body
                    const body = {
                        username: username,
                        password: password
                    };

                    // Registration fields
                    if (mode === "register") {

                        const name =
                            $("#name").value.trim();

                        if (!name) {
                            message.textContent =
                                "Please enter your full name.";
                            return;
                        }

                        body.name = name;
                        body.role = role;

                        // Teacher signup code
                        if (role === "teacher") {

                            const teacherCode =
                                $("#code").value.trim();

                            if (!teacherCode) {
                                message.textContent =
                                    "Please enter the teacher signup code.";
                                return;
                            }

                            body.teacher_code =
                                teacherCode;
                        }
                    }

                    busy = true;
                    $("#submitBtn").disabled = true;

                    try {

                        const endpoint =
                            mode === "register"
                                ? "/register/"
                                : "/login/";

                        const result = await apiJson(
                            "POST",
                            endpoint,
                            body
                        );

                        // API error
                        if (!result.ok) {
                            message.textContent =
                                errorText(result.data);
                            return;
                        }

                        const data = result.data;

                        if (
                            !data ||
                            !data.token ||
                            !data.role
                        ) {
                            message.textContent =
                                "Unexpected server response.";
                            return;
                        }

                        // Check selected role
                        if (data.role !== role) {

                            message.textContent =
                                "This account is registered as a " +
                                data.role +
                                ". Please select the correct account type.";

                            return;
                        }

                        // Save login details
                        localStorage.setItem(
                            "token",
                            data.token
                        );

                        localStorage.setItem(
                            "username",
                            data.username || username
                        );

                        localStorage.setItem(
                            "role",
                            data.role
                        );

                        localStorage.setItem(
                            "name",
                            data.name || username
                        );

                        // Redirect to correct dashboard
                        if (data.role === "teacher") {
                            window.location.href =
                                "teacher.html";
                        } else {
                            window.location.href =
                                "index.html";
                        }

                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            "Something went wrong. Please try again.";

                    } finally {

                        busy = false;
                        $("#submitBtn").disabled = false;
                    }
                }
            );

            // Initialize the page
            updateInterface();

        })();
    </script>

</body>
</html>
